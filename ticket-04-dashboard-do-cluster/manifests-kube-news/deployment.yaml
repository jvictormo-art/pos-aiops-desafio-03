apiVersion: apps/v1
kind: Deployment
metadata:
  name: nyx-kube-news
  namespace: nyx-dev
  labels:
    app.kubernetes.io/name: kube-news
    app.kubernetes.io/instance: nyx-dev
    app.kubernetes.io/part-of: nyx
    app.kubernetes.io/managed-by: platform
  annotations:
    metacortex.io/owner: "platform"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-news
      app.kubernetes.io/instance: nyx-dev
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-news
        app.kubernetes.io/instance: nyx-dev
        app.kubernetes.io/part-of: nyx
        app.kubernetes.io/managed-by: platform
    spec:
      automountServiceAccountToken: false
      serviceAccountName: nyx-kube-news
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Sem initContainer: o kube-news não tem migração separada. O schema é criado
      # in-process (sequelize.sync({alter: true}) em src/models/post.js, ao subir o server.js).
      containers:
        - name: kube-news
          image: registry.metacortex.io/nyx/kube-news:1.0.0
          ports:
            - containerPort: 8080   # app.listen(8080) em src/server.js
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: nyx-kube-news-config
                  key: DB_HOST
            - name: DB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: nyx-kube-news-config
                  key: DB_DATABASE
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: nyx-kube-news-config
                  key: DB_PORT
            - name: DB_SSL_REQUIRE
              valueFrom:
                configMapKeyRef:
                  name: nyx-kube-news-config
                  key: DB_SSL_REQUIRE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: nyx-kube-news-db
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nyx-kube-news-db
                  key: db-password
          # /ready existe em src/system-life.js (200 após o readTime). /health não toca o banco,
          # mas a liveness usa tcpSocket conforme o padrão.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
